name: encoding-loop

# Mechanical gates for the encoding-loop method (the two that need CI rather than a
# PostToolUse hook): lean-canon budget on CLAUDE.md, and doc+diagram pairing. The other two
# floor disciplines (greppable paraphrases, file-move detection) run as local Claude Code
# hooks. See CONTEXT.md "Mechanical floor" and CLAUDE.md "AI Workflow (Encoding Loop)".

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: encoding-loop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-canon:
    name: CLAUDE.md size budget (soft 400 / hard 500)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Enforce the canon budget
        run: |
          set -euo pipefail
          lines=$(wc -l < CLAUDE.md | tr -d ' ')
          echo "CLAUDE.md is $lines lines."
          if [ "$lines" -gt 500 ]; then
            echo "::error file=CLAUDE.md::CLAUDE.md is $lines lines — over the 500-line hard budget. Move detail to a paired docs/ doc and leave a headline + 'See CLAUDE.md'."
            exit 1
          fi
          if [ "$lines" -gt 400 ]; then
            echo "::warning file=CLAUDE.md::CLAUDE.md is $lines lines — over the 400-line soft budget. Consider trimming."
          fi
          echo "Within budget."

  doc-diagram-pairing:
    name: Every .excalidraw has a sibling .svg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check pairing
        run: |
          set -euo pipefail
          missing=0
          # Every docs/**/*.excalidraw must have a committed sibling <name>.svg.
          while IFS= read -r -d '' src; do
            svg="${src%.excalidraw}.svg"
            if [ ! -f "$svg" ]; then
              echo "::error file=$src::No sibling SVG for $src — run .claude/scripts/rebuild-diagrams.sh and commit the .svg."
              missing=$((missing + 1))
            fi
          done < <(find docs -name '*.excalidraw' -type f -print0 2>/dev/null)
          if [ "$missing" -gt 0 ]; then
            echo "$missing diagram(s) missing their paired SVG."
            exit 1
          fi
          echo "All diagrams paired (or none present)."

  drift-gates:
    name: Drift gates (tombstones · retracted claims · doc orphans)   # NB: this name is a REQUIRED status check — renaming it blocks every merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run the deterministic drift gates
        run: |
          set -euo pipefail
          # These three catch SEMANTIC drift, which every other check in this repo is blind to.
          # The loop already enforced file *shape* (canon budget, diagram pairing, stale refs after
          # a git mv) — and none of that could catch the public engineering-review page still
          # presenting a retracted result as fact, an ADR nothing linked to, or retired NDVI
          # thresholds living on in a component docstring. All three actually happened.
          ./.claude/scripts/check-tombstones.sh
          ./.claude/scripts/check-retracted-claims.sh
          ./.claude/scripts/check-doc-orphans.sh
          # The INVERSE of the retraction gate: fails a listed public doc that has gone
          # STALE — missing the current headline value rather than stating a wrong one.
          # It was local-only until 2026-08-23, so `./dev.sh --check-encoding` enforced
          # it and CI did not: a gate that runs only when someone remembers is
          # documentation, not enforcement — and this kind is worse than none, because
          # passing locally makes it look enforced.
          ./.claude/scripts/check-canonical-results.sh
          ./.claude/scripts/check-scaffold-classpaths.sh
          # Spatial-provenance: layers shown head-to-head must be co-located. The first
          # gate that reaches the pixels — it would have caught the 2026-08-21 reach-
          # provenance gap (rf_malpais vs fm_malpais, ~5 km apart, shown as one reach).
          ./.claude/scripts/check-layer-colocation.sh
